
name: MassActivity CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: massactivity-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Check Ruby syntax
        run: |
          find . -type f -name '*.rb' -not -path './.git/*' \
            -print0 | xargs -0 -r -n1 ruby -c

  build-and-deploy:
    name: Build and deploy
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout Discourse Docker
        uses: actions/checkout@v4
        with:
          repository: discourse/discourse_docker
          path: discourse_docker

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Discourse image
        working-directory: discourse_docker
        run: |
          cat > containers/massactivity.yml <<'YAML'
          templates:
            - "templates/postgres.template.yml"
            - "templates/redis.template.yml"
            - "templates/web.template.yml"
            - "templates/web.ratelimited.template.yml"

          expose:
            - "80:80"
            - "443:443"

          params:
            db_default_text_search_config: "pg_catalog.english"

          env:
            LC_ALL: en_US.UTF-8
            LANG: en_US.UTF-8
            LANGUAGE: en_US.UTF-8
            DISCOURSE_HOSTNAME: "massactivity.site"
            DISCOURSE_DEVELOPER_EMAILS: "aleotu@gmail.com"
            DISCOURSE_SKIP_EMAIL_SETUP: "1"

          volumes:
            - volume:
                host: /var/discourse/shared/standalone
                guest: /shared
            - volume:
                host: /var/discourse/shared/standalone/log/var-log
                guest: /var/log

          hooks:
            after_code:
              - exec:
                  cd: $home/plugins
                  cmd:
                    - git clone https://github.com/discourse/docker_manager.git
                    - git clone https://github.com/merefield/discourse-locations.git
                    - git clone https://github.com/fullymanual-shed/MassActivity01.git mass-activity-01

          run:
            - exec: echo "Beginning of custom commands"
            - exec: echo "End of custom commands"
          YAML

          ./launcher bootstrap massactivity

          docker tag local_discourse/massactivity:latest \
            alexgorushkin/massactivity:${GITHUB_SHA}

          docker tag local_discourse/massactivity:latest \
            alexgorushkin/massactivity:latest

          docker push alexgorushkin/massactivity:${GITHUB_SHA}
          docker push alexgorushkin/massactivity:latest

      - name: Deploy to DigitalOcean
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts

          ssh root@"$DO_HOST" "IMAGE_TAG='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          IMAGE="alexgorushkin/massactivity:${IMAGE_TAG}"

          # Save the exact currently running image for rollback.
          OLD_IMAGE_ID=$(docker inspect -f '{{.Image}}' massactivity)

          docker pull "$IMAGE"

          rollback() {
            status=$?
            trap - ERR

            echo "Deployment failed. Rolling back..."

            docker rm -f massactivity >/dev/null 2>&1 || true

            docker run -d \
              --name massactivity \
              --restart always \
              --entrypoint /sbin/boot \
              --env-file /root/massactivity.env \
              -e DISCOURSE_HOSTNAME=massactivity.site \
              -p 80:80 \
              -p 443:443 \
              -v /var/discourse/shared/standalone:/shared \
              -v /var/discourse/shared/standalone/log/var-log:/var/log \
              "$OLD_IMAGE_ID" || {
                echo "CRITICAL: rollback failed!"
                exit 1
              }

            echo "Previous image restored."
            exit "$status"
          }

          trap rollback ERR

          docker stop -t 600 massactivity
          docker rm massactivity

          docker run -d \
            --name massactivity \
            --restart always \
            --entrypoint /sbin/boot \
            --env-file /root/massactivity.env \
            -e DISCOURSE_HOSTNAME=massactivity.site \
            -p 80:80 \
            -p 443:443 \
            -v /var/discourse/shared/standalone:/shared \
            -v /var/discourse/shared/standalone/log/var-log:/var/log \
            "$IMAGE"

          # Wait up to 120 seconds for the container to start.
          running=false

          for i in $(seq 1 60); do
            running=$(docker inspect -f '{{.State.Running}}' massactivity)
            [ "$running" = "true" ] && break
            sleep 2
          done

          test "$running" = "true"

          # Wait for the HTTP endpoint to respond.
          ready=false

          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 5 \
              -H 'Host: massactivity.site' \
              http://127.0.0.1/ || true)

            if [[ "$code" =~ ^[23][0-9][0-9]$ ]]; then
              ready=true
              break
            fi

            sleep 2
          done

          test "$ready" = "true"

          trap - ERR

          echo "Deployment successful: $IMAGE"
          echo "Previous image retained locally for rollback."
          REMOTE